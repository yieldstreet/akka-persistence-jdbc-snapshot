name: Publish YS backend libraries

on:
  workflow_dispatch:
    inputs:
      library_name:
        description: "Single library name to publish (e.g., core)"
        required: true
        type: string
      library_version:
        description: "Version of the library to publish (e.g., 1.0.0)"
        required: true
        type: string
      branch_name:
        description: "Branch name to checkout (default: master)"
        required: false
        type: string
        default: master
      path:
        description: "Path in the repo where publish commands are run (default: root)"
        required: false
        type: string
        default: "."

jobs:
  publish:
    uses: yieldstreet/github-workflows/.github/workflows/backend-publish.yaml@master
    with:
      LIBRARY_NAME: ${{ inputs.library_name }}
      LIBRARY_VERSION: ${{ inputs.library_version }}
      BRANCH_NAME: ${{ inputs.branch_name }}
      PATH: ${{ inputs.path }}
    secrets: inherit
